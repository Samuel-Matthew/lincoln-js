<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Search</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>TV Show Search</h1>

    <input type="text" id="searchInput" placeholder="Enter a show name" />
    <button id="searchBtn">Search</button>

    <p id="message"></p>

    <div id="results"></div>

    <script>
      const searchInput = document.getElementById("searchInput");
      const searchBtn = document.getElementById("searchBtn");
      const results = document.getElementById("results");
      const message = document.getElementById("message");

      searchBtn.addEventListener("click", searchShows);

      async function searchShows() {
        const searchTerm = searchInput.value.trim();

        // Check for empty search
        if (searchTerm === "") {
          message.textContent = "Please enter a show name.";
          results.innerHTML = "";
          return;
        }

        // Clear previous results
        results.innerHTML = "";

        // Show loading message
        message.textContent = "Loading...";

        try {
          const response = await fetch(
            `https://api.tvmaze.com/search/shows?q=${searchTerm}`,
          );

          const data = await response.json();

          // Check if no results were found
          if (data.length === 0) {
            message.textContent = "No results found.";
            return;
          }

          message.textContent = `${data.length} result(s) found.`;

          // Display the shows
          data.forEach((item) => {
            const show = item.show;

            const showDiv = document.createElement("div");

            showDiv.innerHTML = `
                <h2>${show.name}</h2>

                <p>
                    Genre:
                    ${
                      show.genres.length > 0
                        ? show.genres.join(", ")
                        : "Not available"
                    }
                </p>

                <p>
                    Rating:
                    ${show.rating.average || "Not available"}
                </p>

                <img 
                    src="${
                      show.image
                        ? show.image.medium
                        : "https://via.placeholder.com/210x295"
                    }"
                    alt="${show.name}"
                    width="210"
                >

                <br><br>

                <a 
                    href="${show.url}" 
                    target="_blank"
                >
                    View Show
                </a>

                <hr>
            `;

            results.appendChild(showDiv);
          });
        } catch (error) {
          message.textContent = "Something went wrong. Please try again.";

          console.log(error);
        }
      }
    </script>
  </body>
</html>
